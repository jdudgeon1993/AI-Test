name: Deploy Kitchen App
on:
  push:
    branches: ["main", "master"]

# Automatically cancels stuck previous runs to fix the "Multiple Artifacts" error
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    # Tells GitHub exactly which environment to use to fix "Missing environment" error
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Secret Key
        run: |
          # Uses simple text matching to avoid syntax errors
          sed -i "s|REPLACE_ME_WITH_REAL_KEY|${{ secrets.GEMINI_API_KEY }}|g" index.html
          
          # Fails red if the injection failed so you know immediately
          if grep -q "REPLACE_ME_WITH_REAL_KEY" index.html; then
            echo "Error: Placeholder not replaced."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
