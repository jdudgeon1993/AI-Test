name: Deploy Kitchen App
on:
  push:
    branches: ["main", "master"] # Added master just in case

permissions:
  contents: write # Allows the script to change the text in your files
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Secret Key
        run: |
          # This command looks for EVERY .html file and swaps the placeholder
          find . -name "*.html" -exec sed -i "s/%%GEMINI_API_KEY%%/${{ secrets.GEMINI_API_KEY }}/g" {} +

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        uses: actions/deploy-pages@v4
        
