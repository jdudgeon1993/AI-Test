name: Deploy Kitchen App
on:
  push:
    branches: ["main", "master"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    # This block fixes the "Missing environment" error you saw
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Secret Key
        run: |
          # Finds the clean text placeholder and swaps it for your GitHub Secret
          sed -i "s|REPLACE_ME_WITH_REAL_KEY|${{ secrets.GEMINI_API_KEY }}|g" index.html
          
          # Verification check
          if grep -q "REPLACE_ME_WITH_REAL_KEY" index.html; then
            echo "Injection failed"
            exit 1
          else
            echo "Injection successful"
          fi

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
