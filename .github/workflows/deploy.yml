name: Deploy Kitchen App
on:
  push:
    branches: ["main", "master"]

# Prevents multiple deployments from running at the same time
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Secret Key
        run: |
          # Replaces the simple string with your GitHub Secret
          sed -i "s|REPLACE_ME_WITH_REAL_KEY|${{ secrets.GEMINI_API_KEY }}|g" index.html
          
          # Fails the run if the injection didn't work
          if grep -q "REPLACE_ME_WITH_REAL_KEY" index.html; then
            echo "Injection failed"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
