      - name: Inject Secret Key
        run: |
          # This version handles both single and double quotes and any file named index.html
          # It searches for the placeholder and forces a replacement even if quotes vary
          sed -i "s|'%%GEMINI_API_KEY%%'|'${{ secrets.GEMINI_API_KEY }}'|g" index.html
          sed -i 's|"%%GEMINI_API_KEY%%"|"${{ secrets.GEMINI_API_KEY }}"|g' index.html
          
          # Debug check (This will show if the placeholder still exists without showing your key)
          grep -q "%%GEMINI_API_KEY%%" index.html && echo "STILL THERE" || echo "INJECTION SUCCESSFUL"
