name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Gemini API Key
        run: |
          sed -i "s/PLACEHOLDER_API_KEY/${{ secrets.GEMINI_API_KEY }}/g" index.html
          echo "API key injection complete"

      - name: Verify injection
        run: |
          if grep -q "PLACEHOLDER_API_KEY" index.html; then
            echo "ERROR: Placeholder still exists! Secret may not be configured."
            exit 1
          else
            echo "SUCCESS: API key was injected"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
