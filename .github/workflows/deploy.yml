name: Deploy Kitchen App
on:
  push:
    branches: ["main", "master"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Secret Key
        run: |
          # We use '|' as a delimiter in case your API key contains slashes
          # This replaces the simple string 'REPLACE_ME_WITH_KEY' in your index.html
          sed -i "s|REPLACE_ME_WITH_KEY|${{ secrets.GEMINI_API_KEY }}|g" index.html
          
          # Verification: This makes the Action fail RED if the text wasn't swapped
          if grep -q "REPLACE_ME_WITH_KEY" index.html; then
            echo "Error: The placeholder was not replaced. Check file naming."
            exit 1
          else
            echo "Success: API Key injected into index.html."
          fi

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        uses: actions/deploy-pages@v4
