<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Kitchen Pro v3.0</title>
    <style>
        :root { --orange: #e67e22; --dark: #121212; --card: #1e1e1e; }
        body { font-family: -apple-system, sans-serif; margin: 0; background: var(--dark); color: white; padding-bottom: 50px; }
        #viewfinder { width: 100%; height: 45vh; background: #000; position: sticky; top: 0; z-index: 10; border-bottom: 3px solid var(--orange); }
        video { width: 100%; height: 100%; object-fit: cover; }
        .controls { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .main-btn { background: var(--orange); color: white; border: none; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: bold; }
        .main-btn:disabled { background: #555; opacity: 0.7; }
        .found-card { background: var(--card); padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #3498db; }
        .pantry-container { background: white; color: #333; margin: 15px; padding: 20px; border-radius: 15px; min-height: 200px; }
        .pantry-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; align-items: center; }
        .qty-badge { background: #f39c12; color: white; padding: 2px 8px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        canvas { display: none; }
        #err-log { color: #ff7675; font-size: 11px; text-align: center; margin-top: 5px; }
    </style>
</head>
<body>

<div id="viewfinder"><video id="webcam" autoplay playsinline></video></div>

<div class="controls">
    <button id="capture-btn" class="main-btn">SCAN INGREDIENTS</button>
    <div id="err-log"></div>
    <div id="scan-output"></div>
</div>

<div class="pantry-container">
    <h2 style="margin: 0 0 15px 0; color: #1a1a1a;">Pantry Inventory</h2>
    <div id="pantry-list"></div>
    <button onclick="clearStorage()" style="margin-top: 20px; border: none; background: none; color: #999; font-size: 12px; width: 100%;">Reset All Inventory</button>
</div>

<canvas id="buffer"></canvas>

<script>
    // GitHub will replace this simple text string
    const API_KEY = 'REPLACE_ME_WITH_REAL_KEY'; 
    const MODEL = 'gemini-3-flash-preview'; 
    
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('buffer');
    const pantryBox = document.getElementById('pantry-list');
    const errLog = document.getElementById('err-log');

    async function init() {
        refreshPantry();
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
        } catch (e) { errLog.innerText = "Camera Access Denied"; }
    }

    document.getElementById('capture-btn').onclick = async () => {
        const btn = document.getElementById('capture-btn');
        if (API_KEY === 'REPLACE_ME_WITH_REAL_KEY') {
            errLog.innerText = "Error: Key not found. Check GitHub Actions logs.";
            return;
        }
        
        btn.disabled = true;
        btn.innerText = "AI IS ANALYZING...";
        
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const b64 = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [
                        { text: "List only kitchen ingredient names found here. Format: Item1, Item2" },
                        { inlineData: { mimeType: "image/jpeg", data: b64 } }
                    ]}]
                })
            });
            const data = await res.json();
            showScanResults(data.candidates[0].content.parts[0].text);
        } catch (e) { errLog.innerText = "Error: " + e.message; }
        finally { btn.disabled = false; btn.innerText = "SCAN INGREDIENTS"; }
    };

    function showScanResults(text) {
        const items = text.split(',').map(i => i.trim());
        const output = document.getElementById('scan-output');
        output.innerHTML = "";
        items.forEach(name => {
            if(name.length < 2) return;
            const div = document.createElement('div');
            div.className = 'found-card';
            div.innerHTML = `<span>${name}</span> <button onclick="addToPantry('${name}')" style="background:#2ecc71; color:white; border:none; padding:8px 15px; border-radius:6px;">ADD</button>`;
            output.appendChild(div);
        });
    }

    function addToPantry(name) {
        let data = JSON.parse(localStorage.getItem('kitchen_inventory') || '[]');
        const exist = data.find(i => i.name.toLowerCase() === name.toLowerCase());
        if (exist) { exist.qty += 1; } 
        else { data.push({ name, qty: 1, lastSeen: new Date().toLocaleDateString() }); }
        localStorage.setItem('kitchen_inventory', JSON.stringify(data));
        refreshPantry();
        document.getElementById('scan-output').innerHTML = "";
    }

    function refreshPantry() {
        let data = JSON.parse(localStorage.getItem('kitchen_inventory') || '[]');
        pantryBox.innerHTML = data.length ? "" : "Empty.";
        data.forEach(item => {
            pantryBox.innerHTML += `<div class="pantry-row"><div><strong>${item.name}</strong></div><span class="qty-badge">x${item.qty}</span></div>`;
        });
    }

    function clearStorage() { localStorage.removeItem('kitchen_inventory'); refreshPantry(); }
    init();
</script>
</body>
</html>
