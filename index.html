<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Kitchen Scanner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a1a; color: #fff; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin-bottom: 30px; color: #f39c12; }
        #camera { width: 100%; max-height: 400px; background: #000; border-radius: 10px; margin-bottom: 20px; }
        .btn { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; background: #f39c12; color: #fff; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 10px; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .btn:hover:not(:disabled) { background: #e67e22; }
        #result { background: #2c2c2c; padding: 20px; border-radius: 8px; margin-top: 20px; min-height: 100px; }
        #error { color: #e74c3c; text-align: center; padding: 10px; }
        .ingredient-list { list-style: none; padding: 0; }
        .ingredient-list li { padding: 10px; margin: 5px 0; background: #3a3a3a; border-radius: 5px; border-left: 3px solid #f39c12; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍳 AI Kitchen Scanner</h1>

        <video id="camera" autoplay playsinline></video>
        <canvas id="canvas" style="display: none;"></canvas>

        <button id="scanBtn" class="btn">📸 SCAN INGREDIENTS</button>

        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script>
        const GEMINI_API_KEY = 'PLACEHOLDER_API_KEY';
        const GEMINI_MODEL = 'gemini-1.5-flash';

        const video = document.getElementById('camera');
        const canvas = document.getElementById('canvas');
        const scanBtn = document.getElementById('scanBtn');
        const errorDiv = document.getElementById('error');
        const resultDiv = document.getElementById('result');

        // Initialize camera
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                video.srcObject = stream;
            } catch (err) {
                errorDiv.textContent = '❌ Camera access denied. Please allow camera permissions.';
            }
        }

        // Capture image and send to Gemini API
        scanBtn.addEventListener('click', async () => {
            if (GEMINI_API_KEY === 'PLACEHOLDER_API_KEY') {
                errorDiv.textContent = '❌ API Key not configured. Check GitHub Actions workflow.';
                return;
            }

            scanBtn.disabled = true;
            scanBtn.textContent = '🔄 Analyzing...';
            errorDiv.textContent = '';
            resultDiv.textContent = '';

            try {
                // Capture image from video
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);

                // Convert to base64
                const imageData = canvas.toDataURL('image/jpeg', 0.8);
                const base64Image = imageData.split(',')[1];

                // Call Gemini API
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: "Identify all food ingredients or kitchen items in this image. List each item on a new line. If no food items are visible, say 'No ingredients detected'." },
                                    { inline_data: { mime_type: 'image/jpeg', data: base64Image } }
                                ]
                            }]
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();

                // Display results
                if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                    const text = data.candidates[0].content.parts[0].text;
                    const items = text.split('\n').filter(item => item.trim().length > 0);

                    resultDiv.innerHTML = '<h3>📋 Detected Ingredients:</h3><ul class="ingredient-list">' +
                        items.map(item => `<li>${item}</li>`).join('') +
                        '</ul>';
                } else {
                    resultDiv.textContent = '❓ No ingredients detected';
                }

            } catch (err) {
                errorDiv.textContent = `❌ Error: ${err.message}`;
                console.error('Scan error:', err);
            } finally {
                scanBtn.disabled = false;
                scanBtn.textContent = '📸 SCAN INGREDIENTS';
            }
        });

        // Start camera on page load
        initCamera();
    </script>
</body>
</html>
